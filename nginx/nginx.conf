user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name _;

        # Отдача публичных медиа (прямой доступ)
        location /media/ {
            alias /var/www/media/public/; # /media/filename -> /var/www/media/public/filename
            access_log off;
            expires 30d;
            add_header Cache-Control "public, must-revalidate";
        }

        # Защищённые файлы: internal, только для X-Accel-Redirect
        location /protected/ {
            internal;
            alias /var/www/media/private/; # X-Accel-Redirect: /protected/secret.pdf -> /var/www/media/private/secret.pdf
        }

        # Проксирование к FastAPI (авторизация, API, HTML и т.д.)
        location /api/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass http://app:8000/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
        }

        # Фолбек: отдавать корневой ответ (если нужно)
        location / {
            proxy_pass http://app:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}