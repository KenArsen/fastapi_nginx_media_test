services:
  api:
    build:
      context: .
      dockerfile: src/Dockerfile
    ports:
      - "8000:8000"

  nginx:
    image: nginx:1.25
    ports:
      - "81:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /home/arsen/Documents:/var/www/documents:ro

    depends_on:
      - api